# =============================================================
# nginx reverse proxy for ScamShield AI
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/scamshield
#   sudo ln -s /etc/nginx/sites-available/scamshield /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain TLS certificates:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d scamshield.example.com
#
# Both upstreams bind to 127.0.0.1, so they are never exposed directly.
# =============================================================

# ---------- rate limiting (defines the zones used below) ----------
limit_req_zone $binary_remote_addr zone=api_scan:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_read:10m rate=120r/m;

# ---------- websocket upgrade map (required by Streamlit) ----------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name scamshield.example.com;

    # Certbot will redirect this to HTTPS once a certificate exists.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scamshield.example.com;

    # ssl_certificate     /etc/letsencrypt/live/scamshield.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/scamshield.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # ---------- security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Streamlit needs inline styles/scripts, so the CSP stays permissive for 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;" always;

    # Do not advertise the nginx version.
    server_tokens off;

    client_max_body_size 2m;
    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    # ---------------- API ----------------
    location /api/ {
        limit_req zone=api_scan burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API docs (consider restricting to an allow-list in production)
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # allow 10.0.0.0/8; deny all;   # uncomment to restrict
    }

    # ---------------- Dashboard (Streamlit) ----------------
    location / {
        limit_req zone=api_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamlit's websocket: without these two lines the UI stays "Connecting…".
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
