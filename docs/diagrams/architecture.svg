<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 724" width="1010" height="724" font-family="Inter,Segoe UI,system-ui,sans-serif"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4f8cff"/></marker><marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker><marker id="arrowV" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/></marker></defs><rect width="1010" height="724" fill="#0b1220"/><text x="40" y="40" fill="#e8eefc" font-size="22" font-weight="800">ScamShield AI — System Architecture</text><text x="40" y="62" fill="#96a7c4" font-size="12.5">Three independent detection layers, one fused verdict. ML and Gemini are optional; the system degrades gracefully without them.</text><rect x="40" y="88" width="300" height="96" rx="10" fill="#17233a" stroke="#24344f" stroke-width="1.5"/><text x="190.0" y="114" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">Client (Browser)</text><text x="190.0" y="134" fill="#96a7c4" font-size="11.5" text-anchor="middle">Streamlit UI · frontend/app.py</text><text x="190.0" y="149" fill="#96a7c4" font-size="11.5" text-anchor="middle">6 pages · custom CSS theme</text><text x="190.0" y="164" fill="#96a7c4" font-size="11.5" text-anchor="middle">api_client.py = only HTTP boundary</text><rect x="400" y="88" width="320" height="96" rx="10" fill="#17233a" stroke="#24344f" stroke-width="1.5"/><text x="560.0" y="114" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">FastAPI Backend</text><text x="560.0" y="134" fill="#96a7c4" font-size="11.5" text-anchor="middle">backend/main.py + routers</text><text x="560.0" y="149" fill="#96a7c4" font-size="11.5" text-anchor="middle">CORS · request-id · JSON errors</text><text x="560.0" y="164" fill="#96a7c4" font-size="11.5" text-anchor="middle">Pydantic v2 validation</text><rect x="400" y="246" width="320" height="100" rx="10" fill="#1b2b45" stroke="#4f8cff" stroke-width="1.5"/><text x="560.0" y="272" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">ScanService (orchestrator)</text><text x="560.0" y="292" fill="#96a7c4" font-size="11.5" text-anchor="middle">privacy → rules → ML → URLs</text><text x="560.0" y="307" fill="#96a7c4" font-size="11.5" text-anchor="middle">→ risk fusion → explanation → persist</text><text x="560.0" y="322" fill="#96a7c4" font-size="11.5" text-anchor="middle">backend/services/scan_service.py</text><rect x="40" y="408" width="210" height="96" rx="10" fill="#121c2e" stroke="#22c55e" stroke-width="1.5"/><text x="145.0" y="434" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">Rule Engine</text><text x="145.0" y="454" fill="#96a7c4" font-size="11.5" text-anchor="middle">40+ regex rules</text><text x="145.0" y="469" fill="#96a7c4" font-size="11.5" text-anchor="middle">explainable · deterministic</text><text x="145.0" y="484" fill="#96a7c4" font-size="11.5" text-anchor="middle">weights 0/6/12/20/32</text><rect x="270" y="408" width="210" height="96" rx="10" fill="#121c2e" stroke="#f59e0b" stroke-width="1.5"/><text x="375.0" y="434" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">ML Classifier</text><text x="375.0" y="454" fill="#96a7c4" font-size="11.5" text-anchor="middle">TF-IDF + LogisticRegression</text><text x="375.0" y="469" fill="#96a7c4" font-size="11.5" text-anchor="middle">P(spam) · 162 KB artefact</text><text x="375.0" y="484" fill="#96a7c4" font-size="11.5" text-anchor="middle">trained on 5,158 SMS</text><rect x="500" y="408" width="210" height="96" rx="10" fill="#121c2e" stroke="#f59e0b" stroke-width="1.5"/><text x="605.0" y="434" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">URL Analyser</text><text x="605.0" y="454" fill="#96a7c4" font-size="11.5" text-anchor="middle">static pattern checks</text><text x="605.0" y="469" fill="#96a7c4" font-size="11.5" text-anchor="middle">NO network access</text><text x="605.0" y="484" fill="#96a7c4" font-size="11.5" text-anchor="middle">look-alike detection</text><rect x="400" y="556" width="320" height="84" rx="10" fill="#1b2b45" stroke="#22d3ee" stroke-width="1.5"/><text x="560.0" y="582" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">Risk Assessor</text><text x="560.0" y="602" fill="#96a7c4" font-size="11.5" text-anchor="middle">max(rules, ML, URL) + agreement bonus</text><text x="560.0" y="617" fill="#96a7c4" font-size="11.5" text-anchor="middle">LOW / MEDIUM / HIGH / CRITICAL</text><rect x="760" y="408" width="210" height="96" rx="10" fill="#121c2e" stroke="#a78bfa" stroke-width="1.5"/><text x="865.0" y="434" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">Gemini Explainer</text><text x="865.0" y="454" fill="#96a7c4" font-size="11.5" text-anchor="middle">EN / HI / Hinglish</text><text x="865.0" y="469" fill="#96a7c4" font-size="11.5" text-anchor="middle">explains, never detects</text><text x="865.0" y="484" fill="#96a7c4" font-size="11.5" text-anchor="middle">deterministic fallback</text><rect x="760" y="556" width="210" height="118" rx="10" fill="#121c2e" stroke="#4f8cff" stroke-width="1.5"/><text x="865.0" y="582" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">SQLite</text><text x="865.0" y="602" fill="#96a7c4" font-size="11.5" text-anchor="middle">scans table + indexes</text><text x="865.0" y="617" fill="#96a7c4" font-size="11.5" text-anchor="middle">redacted text only</text><text x="865.0" y="632" fill="#96a7c4" font-size="11.5" text-anchor="middle">retention policy</text><rect x="760" y="88" width="210" height="96" rx="10" fill="#121c2e" stroke="#a78bfa" stroke-width="1.5"/><text x="865.0" y="114" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">Google Gemini API</text><text x="865.0" y="134" fill="#96a7c4" font-size="11.5" text-anchor="middle">optional · internet</text><text x="865.0" y="149" fill="#96a7c4" font-size="11.5" text-anchor="middle">redacted prompt only</text><text x="865.0" y="164" fill="#96a7c4" font-size="11.5" text-anchor="middle">graceful degradation</text><rect x="40" y="556" width="320" height="118" rx="10" fill="#121c2e" stroke="#96a7c4" stroke-width="1.5"/><text x="200.0" y="582" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="middle">Model artefacts</text><text x="200.0" y="602" fill="#96a7c4" font-size="11.5" text-anchor="middle">models/model_logistic_regression.joblib</text><text x="200.0" y="617" fill="#96a7c4" font-size="11.5" text-anchor="middle">models/metrics.json (real metrics)</text><text x="200.0" y="632" fill="#96a7c4" font-size="11.5" text-anchor="middle">ml/vectorizers/tfidf_vectorizer.joblib</text><line x1="340" y1="136" x2="400" y2="136" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/><text x="375.0" y="130.0" fill="#4f8cff" font-size="10.5" font-weight="600">HTTPS/JSON</text><line x1="560" y1="184" x2="560" y2="246" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/><text x="565.0" y="209.0" fill="#4f8cff" font-size="10.5" font-weight="600">validated request</text><line x1="440" y1="346" x2="150" y2="408" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="346" x2="375" y2="408" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/><line x1="650" y1="346" x2="605" y2="408" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="504" x2="560" y2="556" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/><text x="565.0" y="524.0" fill="#4f8cff" font-size="10.5" font-weight="600">three scores</text><line x1="720" y1="596" x2="760" y2="470" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowV)"/><text x="745.0" y="527.0" fill="#a78bfa" font-size="10.5" font-weight="600">verdict</text><line x1="865" y1="408" x2="865" y2="184" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowV)"/><text x="870.0" y="290.0" fill="#a78bfa" font-size="10.5" font-weight="600">generate_content</text><line x1="720" y1="615" x2="760" y2="615" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/><text x="745.0" y="609.0" fill="#4f8cff" font-size="10.5" font-weight="600">persist</text><line x1="360" y1="615" x2="400" y2="615" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowG)" stroke-dasharray="5,4"/><text x="385.0" y="609.0" fill="#22c55e" font-size="10.5" font-weight="600">load model</text><text x="40" y="710" fill="#96a7c4" font-size="11">Blue = request path · green dashed = artefact loading · violet = optional AI dependency</text></svg>