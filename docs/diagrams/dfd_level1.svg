<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 740" width="880" height="740" font-family="Inter,Segoe UI,system-ui,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f8cff"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker></defs><rect width="880" height="740" fill="#0b1220"/><text x="40" y="40" fill="#e8eefc" font-size="21" font-weight="800">ScamShield AI — Data Flow Diagram (Level 1)</text><text x="40" y="62" fill="#96a7c4" font-size="11" font-weight="400">External entities are rectangles-context, processes are rounded, data stores are open-ended bars.</text><rect x="30" y="120" width="150" height="70" rx="9" fill="#121c2e" stroke="#22d3ee" stroke-width="1.5"/><text x="105.0" y="160.0" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">User</text><rect x="30" y="340" width="150" height="70" rx="9" fill="#121c2e" stroke="#a78bfa" stroke-width="1.5"/><text x="105.0" y="380.0" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">Gemini API</text><rect x="300" y="100" width="240" height="74" rx="9" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="420.0" y="124" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">P1 · Validate &amp; redact input</text><text x="420.0" y="143.0" fill="#96a7c4" font-size="11" text-anchor="middle">Pydantic schema</text><text x="420.0" y="157.5" fill="#96a7c4" font-size="11" text-anchor="middle">privacy.redact()</text><rect x="300" y="192" width="240" height="74" rx="9" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="420.0" y="216" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">P2 · Rule-based detection</text><text x="420.0" y="235.0" fill="#96a7c4" font-size="11" text-anchor="middle">rule_engine.analyse()</text><rect x="300" y="284" width="240" height="74" rx="9" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="420.0" y="308" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">P3 · ML classification</text><text x="420.0" y="327.0" fill="#96a7c4" font-size="11" text-anchor="middle">predictor.predict()</text><rect x="300" y="376" width="240" height="74" rx="9" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="420.0" y="400" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">P4 · URL static analysis</text><text x="420.0" y="419.0" fill="#96a7c4" font-size="11" text-anchor="middle">url_analyzer.analyse_text()</text><rect x="300" y="468" width="240" height="74" rx="9" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="420.0" y="492" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">P5 · Risk fusion</text><text x="420.0" y="511.0" fill="#96a7c4" font-size="11" text-anchor="middle">risk_assessor.assess()</text><rect x="300" y="560" width="240" height="74" rx="9" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="420.0" y="584" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">P6 · Explanation generation</text><text x="420.0" y="603.0" fill="#96a7c4" font-size="11" text-anchor="middle">gemini_service.explain()</text><rect x="300" y="652" width="240" height="74" rx="9" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="420.0" y="676" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">P7 · Persist &amp; report</text><text x="420.0" y="695.0" fill="#96a7c4" font-size="11" text-anchor="middle">repository.save_scan()</text><rect x="660" y="120" width="190" height="64" rx="9" fill="#121c2e" stroke="#22c55e" stroke-width="1.5"/><text x="755.0" y="144" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">D1 · scans (SQLite)</text><text x="755.0" y="163.0" fill="#96a7c4" font-size="11" text-anchor="middle">history + statistics</text><rect x="660" y="300" width="190" height="64" rx="9" fill="#121c2e" stroke="#22c55e" stroke-width="1.5"/><text x="755.0" y="324" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">D2 · model artefacts</text><text x="755.0" y="343.0" fill="#96a7c4" font-size="11" text-anchor="middle">joblib + metrics.json</text><rect x="660" y="480" width="190" height="64" rx="9" fill="#121c2e" stroke="#22c55e" stroke-width="1.5"/><text x="755.0" y="504" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="middle">D3 · rule catalogue</text><text x="755.0" y="523.0" fill="#96a7c4" font-size="11" text-anchor="middle">rule_catalog.py</text><line x1="180" y1="155" x2="300" y2="137" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><text x="244.0" y="141.0" fill="#4f8cff" font-size="10" font-weight="600">message / URL</text><line x1="420" y1="174" x2="420" y2="192" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="229" x2="220" y2="220" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="540" y1="211" x2="660" y2="320" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="540" y1="229" x2="660" y2="500" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="420" y1="266" x2="420" y2="284" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="420" y1="358" x2="420" y2="376" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="660" y1="352" x2="540" y2="303" stroke="#22c55e" stroke-width="2" marker-end="url(#g)" stroke-dasharray="5,4"/><line x1="420" y1="450" x2="420" y2="468" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="420" y1="542" x2="420" y2="560" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="540" y1="470" x2="660" y2="152" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><text x="604.0" y="306.0" fill="#4f8cff" font-size="10" font-weight="600">stored scan</text><line x1="540" y1="600" x2="660" y2="152" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5,4"/><line x1="300" y1="600" x2="180" y2="395" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/><text x="244.0" y="492.5" fill="#a78bfa" font-size="10" font-weight="600">prompt (redacted)</text><line x1="180" y1="360" x2="300" y2="585" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5,4"/><text x="244.0" y="467.5" fill="#a78bfa" font-size="10" font-weight="600">narrative</text><line x1="660" y1="540" x2="540" y2="596" stroke="#22c55e" stroke-width="2" marker-end="url(#g)"/><text x="604.0" y="563.0" fill="#22c55e" font-size="10" font-weight="600">rules</text><text x="40" y="720" fill="#96a7c4" font-size="11" font-weight="400">Every process can fail without breaking the scan: ML off → rules only; Gemini off → deterministic fallback.</text></svg>