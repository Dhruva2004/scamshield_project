<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 812" width="1010" height="812" font-family="Inter,Segoe UI,system-ui,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f8cff"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker></defs><rect width="1010" height="780" fill="#0b1220"/><text x="40" y="40" fill="#e8eefc" font-size="21" font-weight="800">ScamShield AI — UML Class Diagram (core services)</text><rect x="40" y="80" width="250" height="156" rx="6" fill="#121c2e" stroke="#22d3ee" stroke-width="1.5"/><rect x="40" y="80" width="250" height="24" rx="6" fill="#17233a" stroke="#22d3ee" stroke-width="1.5"/><text x="165.0" y="96" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">ScanRequest / ScanResponse</text><text x="48" y="118" fill="#96a7c4" font-size="10">+ text: str</text><text x="48" y="132" fill="#96a7c4" font-size="10">+ scan_type: ScanType</text><text x="48" y="146" fill="#96a7c4" font-size="10">+ language: Language</text><text x="48" y="160" fill="#96a7c4" font-size="10">+ include_explanation: bool</text><line x1="40" y1="169" x2="290" y2="169" stroke="#22d3ee" stroke-width="1"/><text x="48" y="178" fill="#22d3ee" font-size="10">+ risk: RiskAssessment</text><text x="48" y="192" fill="#22d3ee" font-size="10">+ rule_engine: RuleEngineResult</text><text x="48" y="206" fill="#22d3ee" font-size="10">+ ml_prediction: MLPrediction</text><text x="48" y="220" fill="#22d3ee" font-size="10">+ urls: URLAnalysisResult</text><rect x="340" y="80" width="280" height="114" rx="6" fill="#121c2e" stroke="#4f8cff" stroke-width="1.5"/><rect x="340" y="80" width="280" height="24" rx="6" fill="#17233a" stroke="#4f8cff" stroke-width="1.5"/><text x="480.0" y="96" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">ScanService</text><text x="348" y="118" fill="#96a7c4" font-size="10">- _detect_type()</text><text x="348" y="132" fill="#96a7c4" font-size="10">- _save()</text><line x1="340" y1="141" x2="620" y2="141" stroke="#4f8cff" stroke-width="1"/><text x="348" y="150" fill="#22d3ee" font-size="10">+ scan(request, persist) -> ScanResponse</text><text x="348" y="164" fill="#22d3ee" font-size="10">+ scan_url_only(...)</text><text x="348" y="178" fill="#22d3ee" font-size="10">+ scan_batch(batch) -> list</text><rect x="670" y="80" width="270" height="114" rx="6" fill="#121c2e" stroke="#22c55e" stroke-width="1.5"/><rect x="670" y="80" width="270" height="24" rx="6" fill="#17233a" stroke="#22c55e" stroke-width="1.5"/><text x="805.0" y="96" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">RuleEngine</text><text x="678" y="118" fill="#96a7c4" font-size="10">+ rules: list[RuleSpec]</text><line x1="670" y1="127" x2="940" y2="127" stroke="#22c55e" stroke-width="1"/><text x="678" y="136" fill="#22d3ee" font-size="10">+ evaluate(text) -> list[RuleFinding]</text><text x="678" y="150" fill="#22d3ee" font-size="10">+ analyse(text) -> RuleEngineResult</text><text x="678" y="164" fill="#22d3ee" font-size="10">+ score_to_level(score) -> RiskLevel</text><text x="678" y="178" fill="#22d3ee" font-size="10">- _score(findings) -> (int, reasons)</text><rect x="40" y="300" width="250" height="142" rx="6" fill="#121c2e" stroke="#22c55e" stroke-width="1.5"/><rect x="40" y="300" width="250" height="24" rx="6" fill="#17233a" stroke="#22c55e" stroke-width="1.5"/><text x="165.0" y="316" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">RuleSpec (frozen dataclass)</text><text x="48" y="338" fill="#96a7c4" font-size="10">+ rule_id: str</text><text x="48" y="352" fill="#96a7c4" font-size="10">+ title: str</text><text x="48" y="366" fill="#96a7c4" font-size="10">+ category: str</text><text x="48" y="380" fill="#96a7c4" font-size="10">+ severity: Severity</text><text x="48" y="394" fill="#96a7c4" font-size="10">+ patterns: list[str]</text><text x="48" y="408" fill="#96a7c4" font-size="10">+ advice: str</text><line x1="40" y1="417" x2="290" y2="417" stroke="#22c55e" stroke-width="1"/><text x="48" y="426" fill="#22d3ee" font-size="10">(immutable data)</text><rect x="340" y="300" width="280" height="100" rx="6" fill="#121c2e" stroke="#f59e0b" stroke-width="1.5"/><rect x="340" y="300" width="280" height="24" rx="6" fill="#17233a" stroke="#f59e0b" stroke-width="1.5"/><text x="480.0" y="316" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">SpamPredictor</text><text x="348" y="338" fill="#96a7c4" font-size="10">+ threshold: float</text><line x1="340" y1="347" x2="620" y2="347" stroke="#f59e0b" stroke-width="1"/><text x="348" y="356" fill="#22d3ee" font-size="10">+ predict(text) -> MLPrediction</text><text x="348" y="370" fill="#22d3ee" font-size="10">+ explain_tokens(text) -> dict</text><text x="348" y="384" fill="#22d3ee" font-size="10">+ predict_batch(texts) -> list</text><rect x="670" y="300" width="270" height="100" rx="6" fill="#121c2e" stroke="#f59e0b" stroke-width="1.5"/><rect x="670" y="300" width="270" height="24" rx="6" fill="#17233a" stroke="#f59e0b" stroke-width="1.5"/><text x="805.0" y="316" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">ModelRegistry</text><text x="678" y="338" fill="#96a7c4" font-size="10">- _bundle: LoadedModel | None</text><line x1="670" y1="347" x2="940" y2="347" stroke="#f59e0b" stroke-width="1"/><text x="678" y="356" fill="#22d3ee" font-size="10">+ load(force) -> LoadedModel | None</text><text x="678" y="370" fill="#22d3ee" font-size="10">+ predict_proba(texts) -> list[float]</text><text x="678" y="384" fill="#22d3ee" font-size="10">+ performance_metrics() -> dict</text><rect x="40" y="520" width="250" height="114" rx="6" fill="#121c2e" stroke="#f59e0b" stroke-width="1.5"/><rect x="40" y="520" width="250" height="24" rx="6" fill="#17233a" stroke="#f59e0b" stroke-width="1.5"/><text x="165.0" y="536" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">URLAnalyzer</text><text x="48" y="558" fill="#96a7c4" font-size="10">+ brands / shorteners / TLDs</text><line x1="40" y1="567" x2="290" y2="567" stroke="#f59e0b" stroke-width="1"/><text x="48" y="576" fill="#22d3ee" font-size="10">+ analyse(url) -> URLInfo</text><text x="48" y="590" fill="#22d3ee" font-size="10">+ analyse_text(text) -> (list, int)</text><text x="48" y="604" fill="#22d3ee" font-size="10">- _split_host(host)</text><text x="48" y="618" fill="#22d3ee" font-size="10">- _build_info(...)</text><rect x="340" y="520" width="280" height="100" rx="6" fill="#121c2e" stroke="#22d3ee" stroke-width="1.5"/><rect x="340" y="520" width="280" height="24" rx="6" fill="#17233a" stroke="#22d3ee" stroke-width="1.5"/><text x="480.0" y="536" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">RiskAssessor</text><text x="348" y="558" fill="#96a7c4" font-size="10">+ ML_COMPONENT_CAP = 85</text><line x1="340" y1="567" x2="620" y2="567" stroke="#22d3ee" stroke-width="1"/><text x="348" y="576" fill="#22d3ee" font-size="10">+ assess(rule, ml, urls) -> RiskAssessment</text><text x="348" y="590" fill="#22d3ee" font-size="10">- _build_reasons(...)</text><text x="348" y="604" fill="#22d3ee" font-size="10">- _build_actions(...)</text><rect x="670" y="520" width="270" height="114" rx="6" fill="#121c2e" stroke="#a78bfa" stroke-width="1.5"/><rect x="670" y="520" width="270" height="24" rx="6" fill="#17233a" stroke="#a78bfa" stroke-width="1.5"/><text x="805.0" y="536" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">GeminiExplainer</text><text x="678" y="558" fill="#96a7c4" font-size="10">+ api_key / model_name</text><text x="678" y="572" fill="#96a7c4" font-size="10">+ enabled: bool</text><line x1="670" y1="581" x2="940" y2="581" stroke="#a78bfa" stroke-width="1"/><text x="678" y="590" fill="#22d3ee" font-size="10">+ explain(...) -> Explanation</text><text x="678" y="604" fill="#22d3ee" font-size="10">- _ensure_client()</text><text x="678" y="618" fill="#22d3ee" font-size="10">- _call_model(prompt)</text><rect x="340" y="700" width="300" height="114" rx="6" fill="#121c2e" stroke="#22d3ee" stroke-width="1.5"/><rect x="340" y="700" width="300" height="24" rx="6" fill="#17233a" stroke="#22d3ee" stroke-width="1.5"/><text x="490.0" y="716" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">ScanRepository</text><text x="348" y="738" fill="#96a7c4" font-size="10">+ repository singleton</text><line x1="340" y1="747" x2="640" y2="747" stroke="#22d3ee" stroke-width="1"/><text x="348" y="756" fill="#22d3ee" font-size="10">+ save_scan(record) -> int</text><text x="348" y="770" fill="#22d3ee" font-size="10">+ list_scans(...) -> list</text><text x="348" y="784" fill="#22d3ee" font-size="10">+ get_stats() -> dict</text><text x="348" y="798" fill="#22d3ee" font-size="10">+ clear_all() -> int</text><rect x="690" y="700" width="240" height="100" rx="6" fill="#121c2e" stroke="#22d3ee" stroke-width="1.5"/><rect x="690" y="700" width="240" height="24" rx="6" fill="#17233a" stroke="#22d3ee" stroke-width="1.5"/><text x="810.0" y="716" fill="#e8eefc" font-size="12" font-weight="700" text-anchor="middle">PrivacyService (functions)</text><text x="698" y="738" fill="#96a7c4" font-size="10">(module-level helpers)</text><line x1="690" y1="747" x2="930" y2="747" stroke="#22d3ee" stroke-width="1"/><text x="698" y="756" fill="#22d3ee" font-size="10">+ redact(text) -> str</text><text x="698" y="770" fill="#22d3ee" font-size="10">+ content_hash(text) -> str</text><text x="698" y="784" fill="#22d3ee" font-size="10">+ privacy_payload(text) -> dict</text><line x1="290" y1="150" x2="340" y2="150" stroke="#4f8cff" stroke-width="1.6"/><text x="296" y="144" fill="#4f8cff" font-size="9" font-weight="400">uses</text><line x1="480" y1="180" x2="480" y2="300" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="620" y1="150" x2="670" y2="150" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="800" y1="300" x2="800" y2="230" stroke="#22c55e" stroke-width="2" marker-end="url(#g)" stroke-dasharray="4,3"/><line x1="290" y1="560" x2="340" y2="560" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="420" x2="480" y2="520" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="620" y1="560" x2="670" y2="560" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="620" x2="480" y2="700" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/><line x1="165" y1="380" x2="165" y2="520" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="4,3"/><text x="40" y="760" fill="#96a7c4" font-size="11" font-weight="400">Green dashed = dependency on a data artefact · blue = composition/usage</text></svg>